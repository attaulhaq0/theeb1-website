name: Verify website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website-and-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Check PHP syntax
        run: find public/api tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test offline form security
        run: php tests/forms-security.php

  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan working tree and complete Git history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gitleaks_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$gitleaks_dir"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt --dir "$gitleaks_dir"
          cd "$gitleaks_dir"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks dir "$GITHUB_WORKSPACE" --redact --no-banner
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner
